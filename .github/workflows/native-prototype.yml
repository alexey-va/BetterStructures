name: Native structures experiment

on:
  push:
    branches: [experiment/native-structures]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew --no-daemon -p native-prototype test assemble
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Native-structures-tests-${{ github.run_id }}
          path: native-prototype/build/reports/tests/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve lab candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Native-structures-${{ github.sha }}
          path: native-prototype/build/libs/ArcNativeStructuresLab-0.1.0.jar
          retention-days: 30
          if-no-files-found: error
