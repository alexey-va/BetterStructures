name: Native structures experiment

on:
  push:
    branches: [experiment/native-structures]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - project: native-prototype
            artifact: ArcNativeStructuresLab-0.1.0.jar
          - project: native-generation-prototype
            artifact: ArcNativeStructuresLab-0.2.0.jar
          - project: .
            artifact: BetterStructures.jar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Download immutable build inputs
        if: matrix.project == '.'
        shell: bash
        run: |
          mkdir -p build/inputs
          curl --fail --location --retry 3 \
            --output build/inputs/MagmaCore-2.2.0-ruscrafting.paper-1.21.11-upstream.9ccd02d.jar \
            https://repo.rus-crafting.ru/grocermc/ru/ruscrafting/thirdparty/magmacore-paper12111/2.2.0-source.9ccd02d/magmacore-paper12111-2.2.0-source.9ccd02d.jar
          curl --fail --location --retry 3 \
            --output build/inputs/FastAsyncWorldEdit-Paper-2.15.5-1079481.jar \
            https://repo.rus-crafting.ru/grocermc/ru/ruscrafting/thirdparty/fawe-paper-api/2.15.5-snapshot.1079481/fawe-paper-api-2.15.5-snapshot.1079481.jar
          curl --fail --location --retry 3 \
            --output build/inputs/EliteMobs-10.9.11.jar \
            https://cdn.modrinth.com/data/ypMp4OVC/versions/PN80pvAb/EliteMobs.jar
      - run: ./gradlew --no-daemon -p ${{ matrix.project }} test assemble
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Native-structures-tests-${{ matrix.project }}-${{ github.run_id }}
          path: ${{ matrix.project }}/build/reports/tests/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve lab candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Native-structures-${{ matrix.project }}-${{ github.sha }}
          path: ${{ matrix.project }}/build/libs/${{ matrix.artifact }}
          retention-days: 30
          if-no-files-found: error
