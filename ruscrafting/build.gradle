import java.security.MessageDigest
import java.util.zip.ZipFile

plugins {
    id 'java'
}

group = 'ru.ruscrafting.forks'
version = '2.7.10-ruscrafting.1'

repositories {
    mavenCentral()
    maven { url = 'https://artifactory.papermc.io/artifactory/universe/' }
}

def baselineUrl = 'https://cdn.modrinth.com/data/KYXglN2M/versions/yGcyhBAm/BetterStructures.jar'
def baselineSha256 = '77219d27dcdd423fbeddd95a735d5bcd600a6a0f4e002ce52df262a587846aff'
def baselineJar = layout.buildDirectory.file('baseline/BetterStructures-2.7.10.jar')
def digest = { File file -> MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() }
def downloadBaseline = tasks.register('downloadBaseline') {
    inputs.property('url', baselineUrl)
    inputs.property('sha256', baselineSha256)
    outputs.file(baselineJar)
    outputs.upToDateWhen { baselineJar.get().asFile.isFile() && digest(baselineJar.get().asFile) == baselineSha256 }
    doLast {
        File target = baselineJar.get().asFile
        if (!target.exists()) {
            target.parentFile.mkdirs()
            File temporary = new File(target.parentFile, target.name + '.part')
            try {
                new URI(baselineUrl).toURL().withInputStream { input -> temporary.withOutputStream { it << input } }
                if (digest(temporary) != baselineSha256) throw new GradleException('Official BetterStructures baseline SHA-256 mismatch')
                java.nio.file.Files.move(temporary.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } finally {
                temporary.delete()
            }
        }
        if (digest(target) != baselineSha256) throw new GradleException('Official BetterStructures baseline SHA-256 mismatch')
    }
}
def baseline = files(baselineJar).builtBy(downloadBaseline)
def paperApi = 'io.papermc.paper:paper-api:1.21.11-R0.1-20260511.115010-91'

dependencies {
    compileOnly baseline
    compileOnly paperApi
    testImplementation baseline
    testImplementation paperApi
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

dependencyLocking {
    lockAllConfigurations()
    // Paper's module metadata names SNAPSHOT even for this immutable timestamp.
    // Locking rewrites that identity and conflicts with the pinned request.
    ignoredDependencies.add('io.papermc.paper:paper-api')
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def replacements = [
    'com/magmaguy/betterstructures/listeners/NewChunkLoadEvent.class',
    'com/magmaguy/betterstructures/listeners/NewChunkLoadEvent$1.class',
    'com/magmaguy/betterstructures/listeners/NewChunkLoadEvent$LoadingChunkKey.class',
    'com/magmaguy/betterstructures/listeners/ChunkScanReentrancyGuard.class',
    'com/magmaguy/betterstructures/worldedit/PasteChunkReadiness.class'
] as Set
def additions = [
    'com/magmaguy/betterstructures/util/PluginChunkLease.class',
    'com/magmaguy/betterstructures/util/PluginChunkLease$Key.class',
    'com/magmaguy/betterstructures/util/PluginChunkLease$Held.class'
] as Set
def descriptor = layout.buildDirectory.file('overlay/plugin.yml')
def prepareDescriptor = tasks.register('prepareDescriptor') {
    dependsOn downloadBaseline
    inputs.file(baselineJar)
    inputs.property('version', project.version.toString())
    outputs.file(descriptor)
    doLast {
        new ZipFile(baselineJar.get().asFile).withCloseable { zip ->
            String original = zip.getInputStream(zip.getEntry('plugin.yml')).getText('UTF-8')
            String versionLine = "version: '2.7.10'"
            if (original.count(versionLine) != 1) throw new GradleException('Unexpected baseline plugin descriptor')
            File target = descriptor.get().asFile
            target.parentFile.mkdirs()
            target.setText(original.replace(versionLine, "version: '${project.version}'"), 'UTF-8')
        }
    }
}

// Zip preserves the official manifest payload; a new Jar manifest would rewrite it.
tasks.named('jar') { enabled = false }
def overlayJar = tasks.register('overlayJar', Zip) {
    dependsOn classes, prepareDescriptor
    archiveFileName = "BetterStructures-${project.version}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from(sourceSets.main.output)
    from(descriptor) { into '' }
    from({ zipTree(baselineJar.get().asFile) }) {
        exclude { entry -> replacements.contains(entry.path) || entry.path == 'plugin.yml' }
    }
}
tasks.named('assemble') { dependsOn overlayJar }

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    testLogging { events 'failed', 'skipped' }
}
tasks.named('test', Test) {
    dependsOn overlayJar
    // Exercise the packaged replacement, not a class left in build/classes.
    classpath = files(sourceSets.test.output, overlayJar.flatMap { it.archiveFile }) +
            (sourceSets.test.runtimeClasspath - sourceSets.main.output)
    systemProperty 'candidateJar', overlayJar.flatMap { it.archiveFile }.get().asFile.absolutePath
}

def baselineOracle = tasks.register('baselineOracle', Test) {
    dependsOn testClasses, downloadBaseline
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = files(sourceSets.test.output, baseline) +
            (sourceSets.test.runtimeClasspath - sourceSets.main.output)
    filter { includeTestsMatching 'com.magmaguy.betterstructures.listeners.NewChunkLoadEventTest.scanRunsOnlyAfterEventReturns' }
    ignoreFailures = true
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/baselineOracle')
    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/baselineOracle')
}

tasks.register('verifyOverlay') {
    dependsOn test, baselineOracle
    inputs.file(baselineJar)
    inputs.file(overlayJar.flatMap { it.archiveFile })
    doLast {
        if (digest(baselineJar.get().asFile) != baselineSha256) throw new GradleException('Baseline hash changed')
        def entries = { File jar ->
            new ZipFile(jar).withCloseable { zip ->
                zip.entries().findAll { !it.directory }.collectEntries { entry ->
                    [(entry.name): zip.getInputStream(entry).bytes]
                }
            }
        }
        def original = entries(baselineJar.get().asFile)
        def candidate = entries(overlayJar.get().archiveFile.get().asFile)
        if (original.keySet() + additions != candidate.keySet()) throw new GradleException('Overlay changed unexpected archive entries')
        Set changed = original.keySet().findAll { !Arrays.equals(original[it], candidate[it]) } as Set
        if (changed != replacements + ['plugin.yml']) throw new GradleException("Unexpected changed entries: ${changed}")
        (replacements + additions).each { name ->
            byte[] bytes = candidate[name]
            int major = ((bytes[6] & 255) << 8) | (bytes[7] & 255)
            if (major != 65) throw new GradleException("Unexpected class version ${major}: ${name}")
        }
        File report = layout.buildDirectory.file('test-results/baselineOracle/TEST-com.magmaguy.betterstructures.listeners.NewChunkLoadEventTest.xml').get().asFile
        def oracle = new groovy.xml.XmlSlurper().parse(report)
        if (oracle.@tests.text() != '1' || oracle.@failures.text() != '1' || oracle.@errors.text() != '0' ||
                !oracle.testcase.failure.@message.text().contains('chunk scan must not execute within ChunkLoadEvent')) {
            throw new GradleException('Official baseline did not fail the expected regression assertion')
        }
        logger.lifecycle("Verified ${original.size()} original entry payloads: only five replacement classes and plugin.yml changed; three shared-lease classes added; baseline regression failed as expected.")
    }
}
tasks.named('check') { dependsOn 'verifyOverlay' }
